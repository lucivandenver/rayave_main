<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f8f62">
    <title>RayAve - Offline</title>
    <style>
        :root {
            color-scheme: light;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top, #e9fff3 0%, #f8fffb 48%, #ffffff 100%);
            color: #124430;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .card {
            width: min(420px, 100%);
            background: #ffffff;
            border: 1px solid #d3efdf;
            border-radius: 20px;
            box-shadow: 0 16px 36px rgba(10, 74, 49, 0.12);
            padding: 24px;
            text-align: center;
        }

        .icon {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            margin: 0 auto 16px;
            display: block;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 1.5rem;
        }

        p {
            margin: 0;
            line-height: 1.55;
            color: #2b5b46;
        }
    </style>
</head>
<body>
    <main class="card">
        <img src="assets/icons/rayave-icon-192.png" alt="RayAve icon" class="icon">
        <h1>You're offline</h1>
        <p>RayAve needs an internet connection to load this page. Please reconnect and try again.</p>
    </main>
</body>
</html>
